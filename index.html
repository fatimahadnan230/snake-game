<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Snake 🐍✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-blue-100 min-h-screen flex flex-col items-center justify-center p-4 select-none">

    <!-- Game Card Container -->
    <div class="bg-white/80 backdrop-blur-md border border-white shadow-2xl rounded-3xl p-6 max-w-md w-full text-center relative overflow-hidden">
        
        <!-- Header -->
        <header class="mb-4">
            <span class="bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Game Development Society</span>
            <h1 class="text-3xl font-bold text-gray-700 mt-2">🐍 Snake Game ✨</h1>
            <p class="text-gray-500 text-sm mt-1">Use Arrow Keys or WASD to guide the snake!</p>
        </header>

        <!-- Canvas Game Screen -->
        <div class="relative w-full aspect-square rounded-2xl overflow-hidden shadow-inner bg-gradient-to-b from-pink-50 to-purple-50 flex items-center justify-center">
            <canvas id="gameCanvas" width="400" height="400" class="w-full h-full block"></canvas>

            <!-- Overlay Start Screen -->
            <div id="startScreen" class="absolute inset-0 bg-white/50 backdrop-blur-xs flex flex-col items-center justify-center p-6 text-gray-700">
                <div class="text-6xl animate-bounce mb-2">🐍</div>
                <h2 class="text-2xl font-bold">Macaron Muncher</h2>
                <p class="text-sm text-gray-600 mt-1 mb-6">Eat yummy treats and grow longer!</p>
                <button onclick="startGame()" class="bg-gradient-to-r from-pink-400 to-purple-400 text-white font-bold px-6 py-3 rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-all">
                    Start Game ✨
                </button>
            </div>

            <!-- Overlay Game Over Screen -->
            <div id="gameOverScreen" class="absolute inset-0 bg-white/60 backdrop-blur-sm hidden flex-col items-center justify-center p-6 text-gray-700">
                <div class="text-5xl mb-2">😢</div>
                <h2 class="text-2xl font-bold text-gray-800">Game Over!</h2>
                <div class="bg-white/80 rounded-2xl p-4 my-4 w-full border border-pink-100 shadow-sm">
                    <p class="text-sm text-gray-500">Score: <span id="finalScore" class="font-bold text-pink-500 text-lg">0</span></p>
                    <p class="text-sm text-gray-500">Best Score: <span id="bestScore" class="font-bold text-purple-500 text-lg">0</span></p>
                </div>
                <button onclick="startGame()" class="bg-gradient-to-r from-pink-400 to-purple-400 text-white font-bold px-6 py-3 rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-all">
                    Play Again 🔄
                </button>
            </div>
        </div>

        <!-- Footer Stats -->
        <div class="flex justify-between items-center mt-4 px-2 text-sm font-semibold text-gray-600">
            <div>Score: <span id="scoreDisplay" class="text-pink-500 font-bold">0</span></div>
            <div>Best: <span id="highScoreDisplay" class="text-purple-500 font-bold">0</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 20;
        const tileCount = 20;

        let snake = [];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('pastel_snake_highscore') || 0;
        let gameInterval = null;
        let changingDirection = false;

        document.getElementById('highScoreDisplay').innerText = highScore;

        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'eat') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'over') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        }

        window.addEventListener('keydown', changeDirection);

        function changeDirection(event) {
            const keyPressed = event.key;
            if (changingDirection) return;

            if ((keyPressed === 'ArrowLeft' || keyPressed === 'a' || keyPressed === 'A') && dx === 0) {
                dx = -1; dy = 0; changingDirection = true;
            }
            if ((keyPressed === 'ArrowUp' || keyPressed === 'w' || keyPressed === 'W') && dy === 0) {
                dx = 0; dy = -1; changingDirection = true;
            }
            if ((keyPressed === 'ArrowRight' || keyPressed === 'd' || keyPressed === 'D') && dx === 0) {
                dx = 1; dy = 0; changingDirection = true;
            }
            if ((keyPressed === 'ArrowDown' || keyPressed === 's' || keyPressed === 'S') && dy === 0) {
                dx = 0; dy = 1; changingDirection = true;
            }
        }

        function startGame() {
            score = 0;
            dx = 1;
            dy = 0;
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            createFood();
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('flex');

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(main, 120);
        }

        function main() {
            if (hasGameEnded()) {
                gameOver();
                return;
            }
            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = '#FAF5FF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw soft grid lines
            ctx.strokeStyle = '#F3E8FF';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#EC4899' : '#F472B6';
                ctx.beginPath();
                ctx.roundRect(part.x * gridSize + 2, part.y * gridSize + 2, gridSize - 4, gridSize - 4, 6);
                ctx.fill();
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            
            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                playSound('eat');
                document.getElementById('scoreDisplay').innerText = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function createFood() {
            food.x = randomInt(0, tileCount);
            food.y = randomInt(0, tileCount);
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) createFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = '#A78BFA';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2 - 2, food.y * gridSize + gridSize / 2 - 2, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[i - 1].x && snake[i].y === snake[i - 1].y) return true;
            }
            return snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount;
        }

        function gameOver() {
            clearInterval(gameInterval);
            playSound('over');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('pastel_snake_highscore', highScore);
                document.getElementById('highScoreDisplay').innerText = highScore;
            }

            document.getElementById('finalScore').innerText = score;
            document.getElementById('bestScore').innerText = highScore;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('flex');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Snake 🐍✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');
        body { 
            font-family: 'Quicksand', sans-serif; 
        }

        /* Animated gradient mesh background */
        .animated-bg {
            background: linear-gradient(-45deg, #fbcfe8, #f3e8ff, #e0e7ff, #fce7f3);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Subtle floating animation for cards */
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="animated-bg min-h-screen flex flex-col items-center justify-center p-4 select-none relative overflow-hidden">

    <!-- Background Floating Particles Canvas -->
    <canvas id="bgCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Game Card Container -->
    <div class="z-10 bg-white/70 backdrop-blur-xl border border-white/80 shadow-2xl rounded-[2.5rem] p-6 max-w-md w-full text-center relative overflow-hidden floating-card">
        
        <!-- Header -->
        <header class="mb-4">
            <span class="bg-gradient-to-r from-pink-200 to-purple-200 text-pink-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-white/60 shadow-xs">
                Game Development Society
            </span>
            <h1 class="text-3xl font-bold text-gray-700 mt-2 tracking-tight">🐍 Pastel Snake ✨</h1>
            <p class="text-gray-500 text-sm mt-1">Use Arrow Keys or WASD to guide the snake!</p>
        </header>

        <!-- Canvas Game Screen -->
        <div class="relative w-full aspect-square rounded-3xl overflow-hidden shadow-lg border-2 border-white/80 bg-gradient-to-b from-white/90 to-purple-50/80 flex items-center justify-center">
            <canvas id="gameCanvas" width="400" height="400" class="w-full h-full block z-10"></canvas>

            <!-- Overlay Start Screen -->
            <div id="startScreen" class="absolute inset-0 z-20 bg-white/50 backdrop-blur-xs flex flex-col items-center justify-center p-6 text-gray-700">
                <div class="text-6xl animate-bounce mb-2">🐍</div>
                <h2 class="text-2xl font-bold text-gray-800">Macaron Muncher</h2>
                <p class="text-sm text-gray-600 mt-1 mb-6">Eat yummy treats and grow longer!</p>
                <button onclick="startGame()" class="bg-gradient-to-r from-pink-400 to-purple-400 text-white font-bold px-7 py-3 rounded-2xl shadow-md hover:scale-105 active:scale-95 transition-all border border-white/50">
                    Start Game ✨
                </button>
            </div>

            <!-- Overlay Game Over Screen -->
            <div id="gameOverScreen" class="absolute inset-0 z-20 bg-white/70 backdrop-blur-sm hidden flex-col items-center justify-center p-6 text-gray-700">
                <div class="text-5xl mb-2">😢</div>
                <h2 class="text-2xl font-bold text-gray-800">Game Over!</h2>
                <div class="bg-white/90 rounded-2xl p-4 my-4 w-full border border-pink-100 shadow-sm">
                    <p class="text-sm text-gray-500">Score: <span id="finalScore" class="font-bold text-pink-500 text-lg">0</span></p>
                    <p class="text-sm text-gray-500">Best Score: <span id="bestScore" class="font-bold text-purple-500 text-lg">0</span></p>
                </div>
                <button onclick="startGame()" class="bg-gradient-to-r from-pink-400 to-purple-400 text-white font-bold px-7 py-3 rounded-2xl shadow-md hover:scale-105 active:scale-95 transition-all border border-white/50">
                    Play Again 🔄
                </button>
            </div>
        </div>

        <!-- Footer Stats Bar -->
        <div class="flex justify-between items-center mt-5 px-4 py-2 bg-purple-100/40 border border-purple-200/50 rounded-2xl text-sm font-semibold text-gray-600 shadow-xs">
            <div>Score: <span id="scoreDisplay" class="text-pink-500 font-bold">0</span></div>
            <div>Best: <span id="highScoreDisplay" class="text-purple-500 font-bold">0</span></div>
        </div>
    </div>

    <script>
        /* --- Floating Background Animation Script --- */
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgParticles = [];

        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBgCanvas);
        resizeBgCanvas();

        // Fully supported floating background items
        const symbols = ['✨', '🌸', '🍓', '⭐', '☁️', '💖', '🍡'];
        for (let i = 0; i < 22; i++) {
            bgParticles.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                size: Math.random() * 22 + 16,
                symbol: symbols[Math.floor(Math.random() * symbols.length)],
                speedY: Math.random() * 0.4 + 0.1,
                speedX: (Math.random() - 0.5) * 0.3,
                opacity: Math.random() * 0.5 + 0.3
            });
        }

        function renderBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgParticles.forEach(p => {
                bgCtx.globalAlpha = p.opacity;
                bgCtx.font = `${p.size}px sans-serif`;
                bgCtx.fillText(p.symbol, p.x, p.y);
                p.y -= p.speedY;
                p.x += p.speedX;

                if (p.y < -30) {
                    p.y = bgCanvas.height + 30;
                    p.x = Math.random() * bgCanvas.width;
                }
            });
            requestAnimationFrame(renderBg);
        }
        renderBg();

        /* --- Game Engine Script --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 20;
        const tileCount = 20;

        let snake = [];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('pastel_snake_highscore') || 0;
        let gameInterval = null;
        let changingDirection = false;

        document.getElementById('highScoreDisplay').innerText = highScore;

        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'eat') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'over') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        }

        window.addEventListener('keydown', changeDirection);

        function changeDirection(event) {
            const keyPressed = event.key;
            if (changingDirection) return;

            if ((keyPressed === 'ArrowLeft' || keyPressed === 'a' || keyPressed === 'A') && dx === 0) {
                dx = -1; dy = 0; changingDirection = true;
            }
            if ((keyPressed === 'ArrowUp' || keyPressed === 'w' || keyPressed === 'W') && dy === 0) {
                dx = 0; dy = -1; changingDirection = true;
            }
            if ((keyPressed === 'ArrowRight' || keyPressed === 'd' || keyPressed === 'D') && dx === 0) {
                dx = 1; dy = 0; changingDirection = true;
            }
            if ((keyPressed === 'ArrowDown' || keyPressed === 's' || keyPressed === 'S') && dy === 0) {
                dx = 0; dy = 1; changingDirection = true;
            }
        }

        function startGame() {
            score = 0;
            dx = 1;
            dy = 0;
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            createFood();
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('flex');

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(main, 120);
        }

        function main() {
            if (hasGameEnded()) {
                gameOver();
                return;
            }
            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = 'rgba(250, 245, 255, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Soft grid lines
            ctx.strokeStyle = 'rgba(243, 232, 255, 0.8)';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#EC4899' : '#F472B6';
                ctx.beginPath();
                ctx.roundRect(part.x * gridSize + 2, part.y * gridSize + 2, gridSize - 4, gridSize - 4, 6);
                ctx.fill();
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            
            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                playSound('eat');
                document.getElementById('scoreDisplay').innerText = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function createFood() {
            food.x = randomInt(0, tileCount);
            food.y = randomInt(0, tileCount);
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) createFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = '#A78BFA';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2 - 2, food.y * gridSize + gridSize / 2 - 2, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[i - 1].x && snake[i].y === snake[i - 1].y) return true;
            }
            return snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount;
        }

        function gameOver() {
            clearInterval(gameInterval);
            playSound('over');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('pastel_snake_highscore', highScore);
                document.getElementById('highScoreDisplay').innerText = highScore;
            }

            document.getElementById('finalScore').innerText = score;
            document.getElementById('bestScore').innerText = highScore;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.add('flex');
        }
    </script>
</body>
</html>
